name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # Enables Nx Cloud cache read/write from CI.
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Derive NX_BASE / NX_HEAD so `nx affected` knows what changed
      # (uses Nx Cloud's last successful main commit as the base).
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx run-many -t lint test build

      # Apply D1 migrations before deploy so new code never runs against an
      # outdated schema. `wrangler d1 migrations apply` is idempotent (only
      # pending migrations run), so this is safe on every push.
      - name: Apply D1 migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy only the affected apps to Cloudflare — push to main only, after build.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx nx affected -t deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Nx Cloud recommends fixes for failures to help you get CI green faster.
      - run: npx nx fix-ci
        if: always()

  e2e:
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx nx e2e client-e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/client-e2e/playwright-report/
          retention-days: 7
