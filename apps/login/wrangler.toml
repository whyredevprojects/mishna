name = "login"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"
account_id = "d2f4398a68a7ef6bc0d65e571ce9d0ea"

# Same-origin production: the client (Cloudflare Pages) and both workers all live
# on app.getchevrasmishnayos.com, so auth cookies are first-party (no CORS needed).
# (The apex/www host serves the separate static landing page in apps/www.)
# This route claims the auth paths; the more-general server route (/api/*) handles
# the rest. Cloudflare runs the most specific matching route, so /api/auth/* lands
# here and everything else falls through to the server worker / Pages.
routes = [
  { pattern = "app.mishna2go.com/api/auth/*", zone_name = "mishna2go.com" }
]

# No *.workers.dev URL, and no per-version preview URLs. Both are load-bearing, not
# tidiness: this worker serves /internal/memorized-session, which mints a real session
# from an emailed link, and the route above is what keeps that path unreachable from
# the internet (no hostname on the zone dispatches /internal/* here). A workers.dev or
# preview hostname routes *every* path to the worker, which would open exactly that
# door. Wrangler suppresses the workers.dev route once `routes` is set, but relying on
# an implicit default for a session-minting endpoint is not acceptable — say it.
# (Defense in depth: the endpoint behind it is `serverOnly` and verifies a signed
# token rather than trusting a userId, so even reaching it grants nothing beyond
# holding a valid link. See src/memorized-session.ts.)
workers_dev = false
preview_urls = false

# Local dev: distinct debugger/inspector port so it doesn't collide with the
# server worker's default (9229) when both run via `nx serve client`.
[dev]
inspector_port = 9230

[[d1_databases]]
binding = "DB"
database_name = "mishna-auth"
database_id = "57b23b71-63b5-4b1a-b39c-ab0d6b0414f7"

# Public origin better-auth builds cookies and the Google OAuth callback against.
# Same host as the client and server (the /api/auth/* route above points here), so
# the session cookie is first-party. Overridden locally by `.dev.vars` for dev.
[vars]
BETTER_AUTH_URL = "https://app.mishna2go.com"
# The canonical app origin, trusted by better-auth in ALL environments (added to
# trustedOrigins in createAuth). Unlike BETTER_AUTH_URL, this is deliberately NOT
# overridden in `.dev.vars`: in dev the client and cookies live on localhost, but
# the request reaches this worker through the server worker's AUTH service binding,
# and wrangler's dev binding presents this worker's route host (this origin) as the
# request Origin — so the app host must stay trusted even though BETTER_AUTH_URL is
# localhost. Same host as the client/server; kept in sync from config/domains.json.
APP_ORIGIN = "https://app.mishna2go.com"
# Sender for transactional auth email (verification + password reset). Same verified
# Resend domain as apps/server's reminder sender. The RESEND_API_KEY is a secret
# (wrangler secret put RESEND_API_KEY; .dev.vars for local dev).
RESEND_FROM_EMAIL = "Chevras Mishnayos Baal Peh <noreply@mail.mishna2go.com>"
RESEND_REPLY_TO_EMAIL = "Chevras Mishnayos Baal Peh <support@mishna2go.com>"
ADMIN_USER_IDS= "M2JTnL3rYBQfvagtMqvi6wipwHhZlObE"
