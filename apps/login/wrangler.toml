name = "login"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"
account_id = "d2f4398a68a7ef6bc0d65e571ce9d0ea"

# Local dev: distinct debugger/inspector port so it doesn't collide with the
# server worker's default (9229) when both run via `nx serve client`.
[dev]
inspector_port = 9230

[[d1_databases]]
binding = "DB"
database_name = "mishna-auth"
database_id = "57b23b71-63b5-4b1a-b39c-ab0d6b0414f7"

# Local login-worker URL. Set the real deployed URL before going to Cloudflare;
# the localhost value will fail loudly there rather than silently misbehaving.
[vars]
BETTER_AUTH_URL = "http://localhost:8787"
