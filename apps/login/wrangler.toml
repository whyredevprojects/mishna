name = "login"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"
account_id = "d2f4398a68a7ef6bc0d65e571ce9d0ea"

# Same-origin production: the client (Cloudflare Pages) and both workers all live
# on getchevrasmishnayos.com, so auth cookies are first-party (no CORS needed).
# This route claims the auth paths; the more-general server route (/api/*) handles
# the rest. Cloudflare runs the most specific matching route, so /api/auth/* lands
# here and everything else falls through to the server worker / Pages.
routes = [
  { pattern = "getchevrasmishnayos.com/api/auth/*", zone_name = "getchevrasmishnayos.com" }
]

# Local dev: distinct debugger/inspector port so it doesn't collide with the
# server worker's default (9229) when both run via `nx serve client`.
[dev]
inspector_port = 9230

[[d1_databases]]
binding = "DB"
database_name = "mishna-auth"
database_id = "57b23b71-63b5-4b1a-b39c-ab0d6b0414f7"

# Public origin better-auth builds cookies and the Google OAuth callback against.
# Same host as the client and server (the /api/auth/* route above points here), so
# the session cookie is first-party. Overridden locally by `.dev.vars` for dev.
[vars]
BETTER_AUTH_URL = "https://getchevrasmishnayos.com"
