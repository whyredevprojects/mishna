name: chevras_mishnayos
description: "Chevras Mishnayos mobile app — memorize the Mishna together by Rosh Chodesh Sivan."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  cloudflare_turnstile: ^3.7.0
  google_sign_in: ^7.2.0
  # Data-only package carrying the Mishna text JSON; it declares its own
  # flutter assets, so every consumer bundles them automatically (loaded as
  # packages/mishna_text/data/<file>). 1.0.11's asset declaration was broken;
  # require the fixed release.
  mishna_text: ^1.0.12

# cloudflare_turnstile → flutter_inappwebview 6.1.x pulls an Android plugin
# whose Gradle script uses getDefaultProguardFile('proguard-android.txt'),
# removed in AGP 9 (Flutter 3.44's default). The 6.2.0 betas fix it
# (proguard-android-optimize.txt) and bring their own matching platform
# packages; drop this override once a stable flutter_inappwebview supporting
# AGP 9 ships.
dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

