name = "server"
# >= 2024-10-22 is required for Workflows bindings.
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"
account_id = "d2f4398a68a7ef6bc0d65e571ce9d0ea"

# Same-origin production API. This route claims /api/* on the client's own domain
# so the browser sees one origin (cookies first-party, no CORS). The login worker's
# more specific /api/auth/* route wins for auth paths; the rest land here. Anything
# outside /api/* falls through to the Cloudflare Pages SPA.
routes = [
  { pattern = "getchevrasmishnayos.com/api/*", zone_name = "getchevrasmishnayos.com" }
]

# Auth: the apps/login better-auth worker, reached via this service binding
# (requireAuth validates the session cookie via /api/auth/get-session). The login
# worker also serves the browser's /api/auth/* directly via its own route above.
[[services]]
binding = "AUTH"
service = "login"

# App data store (groups, members, participants, completions). Separate from the
# better-auth `mishna-auth` DB owned by apps/login. Schema lives in ./migrations as
# numbered D1 migrations (tracked in the d1_migrations table). One-time setup:
#   wrangler d1 create mishna-app                 # paste the returned id below
# Then apply pending migrations (see the db:migrate:* scripts in the root package.json):
#   wrangler d1 migrations apply mishna-app --local    # or --remote for production
[[d1_databases]]
binding = "DB"
database_name = "mishna-app"
database_id = "c7b07846-05d0-497b-82d8-89ae41557ed8"
migrations_dir = "migrations"

# Single-instance write mutex serializing join/leave allocation.
[[durable_objects.bindings]]
name = "ALLOCATOR"
class_name = "AllocatorDO"

# Better-auth users (email + name), read-only. The `mishna-auth` DB owned by
# apps/login — separate DB, so recipient identity is merged in memory (no cross-DB
# JOIN). The email path (ReminderWorkflow + admin "send now") reads it for addresses.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "mishna-auth"
database_id = "57b23b71-63b5-4b1a-b39c-ab0d6b0414f7"

# The bulk reminder/weekly send, as a durable Workflow run inside this worker. The
# cron `scheduled` handler creates one instance per fire; it sends via Resend in batches.
[[workflows]]
name = "mishna-reminders"
binding = "REMINDER_WORKFLOW"
class_name = "ReminderWorkflow"

# Fire hourly. The workflow only emails a user when it's 08:00 in that user's timezone,
# so an hourly tick covers every zone exactly once per local day. The email_log table
# makes each (user, kind, week) send happen at most once.
[triggers]
crons = ["0 * * * *"]

[vars]
# The deployed client origin, which serves mishna-text's tractate JSON (its `data/` is
# copied into the client's assets). The sender fetches Hebrew text from here. Override
# locally via .dev.vars if needed.
APP_ORIGIN = "https://getchevrasmishnayos.com"
# Verified Resend sender. RESEND_API_KEY is a secret: `wrangler secret put RESEND_API_KEY`.
RESEND_FROM_EMAIL = "Chevra Mishnayos <reminders@getchevrasmishnayos.com>"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AllocatorDO"]

# Structured logs + the Workflows dashboard for instance/step inspection.
[observability]
enabled = true
